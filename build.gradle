buildscript {
	dependencies {
		// Used by ornithe to convert Minecraft version names into semantic versions
		classpath "net.fabricmc:fabric-loader:${loader_version}"
	}
}

plugins {
	id "net.fabricmc.fabric-loom-remap" version "1.17-SNAPSHOT" apply false
	id "ploceus" version "1.17-SNAPSHOT" apply false
	id 'babric-loom-extension' version '1.17-SNAPSHOT' apply false
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'maven-publish'

	version = rootProject.mod_version
	// Nested projects get their own group, otherwise :common and :ornithe:common would be considered the same module
	group = project.parent == rootProject ? rootProject.maven_group : "${rootProject.maven_group}.${project.parent.name}"

	// :babric:vanilla -> translated-legacy-babric-vanilla
	base.archivesName = "${rootProject.archives_base_name}-${project.path.substring(1).replace(':', '-')}"

	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
	}

	processResources {
		inputs.property "version", project.version

		filesMatching("fabric.mod.json") {
			expand "version": project.version
		}

		// Every mod of the project shares the same icon
		from(rootProject.file("common/src/main/resources")) {
			include "assets/translated-legacy/icon.png"
		}
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = "UTF-8"
		it.options.release = 8
	}

	java {
		sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
		// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
		// if it is present.
		// If you remove this line, sources will not be generated.
		withSourcesJar()
	}

	jar {
		from(rootProject.file("LICENSE")) {
			rename { "${it}_${project.base.archivesName.get()}"}
		}
	}

	// configure the maven publication
	publishing {
		publications {
			mavenJava(MavenPublication) {
				artifactId = project.base.archivesName.get()
				from components.java
			}
		}

		// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
		repositories {
			// Add repositories to publish to here.
			// Notice: This block does NOT have the same function as the block in the top level.
			// The repositories here will be used for publishing your artifact, not for
			// retrieving dependencies.
		}
	}
}