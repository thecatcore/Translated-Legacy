import net.fabricmc.loader.impl.game.minecraft.McVersionLookup

// OrnitheMC ecosystem: this project nests the common code, ornithe common
// and every versioned subproject into a single mod.
//
// A versioned subproject is any directory of ornithe/ with a gradle.properties containing:
//   min_mc_version / max_mc_version: range of Minecraft versions it runs on, used for its name and fabric.mod.json
//   minecraft_version: Minecraft version it is compiled against
//   feather_build (optional): defaults to the one from ornithe/gradle.properties
//   raven_build, sparrow_build, nests_build (optional, also with client_/server_ prefix)
//   environment (optional): client or server, for Minecraft versions with split jars
// Its fabric.mod.json is generated into src/main/resources by generateModJson, and includes translated-legacy-ornithe-<name>.mixins.json if present.

def versionedProjects = subprojects.findAll { it.name != 'common' }

configure([project] + versionedProjects) {
	apply plugin: 'net.fabricmc.fabric-loom-remap'
	apply plugin: 'ploceus'

	ploceus {
		setIntermediaryGeneration(2)
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		mappings ploceus.featherMappings(project.feather_build)
		modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation("net.ornithemc:conditional-mixin:1.0.0")

		ploceus.dependOsl(project.osl_version)

		api project(':common')
	}
}

configure(versionedProjects) {
	def ornitheModId = "${rootProject.archives_base_name}-ornithe"

	loom {
		if (project.findProperty('environment') == 'client') {
			clientOnlyMinecraftJar()
		} else if (project.findProperty('environment') == 'server') {
			serverOnlyMinecraftJar()
		}

		runs.configureEach {
			generateRunConfig = true
		}
	}

	dependencies {
		if (project.hasProperty('raven_build')) {
			exceptions ploceus.raven(project.raven_build)
		}
		if (project.hasProperty('client_raven_build')) {
			clientExceptions ploceus.raven(project.client_raven_build, 'client')
		}
		if (project.hasProperty('server_raven_build')) {
			serverExceptions ploceus.raven(project.server_raven_build, 'server')
		}
		if (project.hasProperty('sparrow_build')) {
			signatures ploceus.sparrow(project.sparrow_build)
		}
		if (project.hasProperty('client_sparrow_build')) {
			clientSignatures ploceus.sparrow(project.client_sparrow_build, 'client')
		}
		if (project.hasProperty('server_sparrow_build')) {
			serverSignatures ploceus.sparrow(project.server_sparrow_build, 'server')
		}
		if (project.hasProperty('nests_build')) {
			nests ploceus.nests(project.nests_build)
		}
		if (project.hasProperty('client_nests_build')) {
			clientNests ploceus.nests(project.client_nests_build, 'client')
		}
		if (project.hasProperty('server_nests_build')) {
			serverNests ploceus.nests(project.server_nests_build, 'server')
		}

		api(project(':ornithe')) {
			transitive = false
		}
	}

	// Same as the OSL workspace: the fabric.mod.json is generated into src/main/resources
	// and committed, the task runs as part of build (or manually with generateModJson)
	def generateModJson = tasks.register('generateModJson', net.fabricmc.loom.task.FabricModJsonV1Task) {
		outputFile = project.file("src/main/resources/fabric.mod.json")

		def mixinConfig = "${ornitheModId}.mixins.json"
		def minMc = project.min_mc_version
		def maxMc = project.max_mc_version

		json {
			modId = ornitheModId
			version = "${project.version}"
			name = "Translated Legacy Ornithe ${minMc} - ${maxMc}"
			description = ""

			author "Cat Core"
			contactInformation = [
					"issues" : "https://github.com/thecatcore/Translated-Legacy/issues",
					"sources": "https://github.com/thecatcore/Translated-Legacy"
			]
			licenses = ["CC0-1.0"]
			icon "assets/translated-legacy/icon.png"

			if (project.hasProperty('entrypoint_init')) {
				entrypoint 'init', project.entrypoint_init
			}

			if (project.hasProperty('entrypoint_client_init')) {
				entrypoint 'client-init', project.entrypoint_client_init
			}

			if (project.hasProperty('entrypoint_server_init')) {
				entrypoint 'server-init', project.entrypoint_server_init
			}

			environment = project.findProperty('environment') ?: '*'

			if (project.file("src/main/resources/${mixinConfig}").exists()) {
				mixin mixinConfig
			}

			depends "fabricloader", "*"
			depends "minecraft", ">=${normalizeMcVersion(minMc)} <=${normalizeMcVersion(maxMc)}"
		}
	}
}

static String normalizeMcVersion(String name) {
	return McVersionLookup.normalizeVersion(name, McVersionLookup.getRelease(name))
}

evaluationDependsOn(':common')
evaluationDependsOnChildren()

remapJar {
	nestedJars.from project(':common').tasks.named('jar')

	versionedProjects.each {
		nestedJars.from it.tasks.named('remapJar')
	}
}
